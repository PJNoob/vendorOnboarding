services:
  postgres:
    environment:
      POSTGRES_DB: vendor
      POSTGRES_PASSWORD: local-vendor
      POSTGRES_USER: vendor
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:

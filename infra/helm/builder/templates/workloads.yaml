{{- $root := . }}
{{- range $role := list "web" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $role }}
spec:
  replicas: {{ if eq $role "web" }}{{ $root.Values.webReplicas }}{{ else }}{{ $root.Values.workerReplicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      serviceAccountName: {{ if $root.Values.workloadIdentity.enabled }}vendor-onboarding-{{ $role }}{{ else }}{{ $root.Values.serviceAccountName }}{{ end }}
      {{- if $root.Values.nodePool.enabled }}
      nodeSelector:
        workload: vendor-onboarding
      tolerations:
        - key: workload
          operator: Equal
          value: vendor-onboarding
          effect: NoSchedule
      {{- end }}
      terminationGracePeriodSeconds: 210
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if eq $role "worker" }}
      initContainers:
        - name: clamav-signatures
          image: {{ $root.Values.image | quote }}
          command: ["freshclam", "--datadir=/tmp/clamav", "--log=/tmp/clamav/freshclam.log", "--pid=/tmp/clamav/freshclam.pid"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
          volumeMounts:
            - mountPath: /tmp/clamav
              name: clamav
      {{- end }}
      {{- if or (eq $role "worker") $root.Values.redisCaSecret }}
      volumes:
        {{- if eq $role "worker" }}
        - name: clamav
          emptyDir: {}
        {{- end }}
        {{- if $root.Values.redisCaSecret }}
        - name: redis-ca
          secret:
            secretName: {{ $root.Values.redisCaSecret | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $role }}
          image: {{ $root.Values.image | quote }}
          {{- if eq $role "worker" }}
          command: ["pnpm", "worker"]
          {{- end }}
          {{- if or (eq $role "worker") $root.Values.redisCaSecret }}
          volumeMounts:
            {{- if eq $role "worker" }}
            - mountPath: /tmp/clamav
              name: clamav
            {{- end }}
            {{- if $root.Values.redisCaSecret }}
            - mountPath: /var/run/redis-ca
              name: redis-ca
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if ne $role "worker" }}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
          {{- end }}
          {{- if $root.Values.redisCaSecret }}
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/redis-ca/ca.pem
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.secretName }}
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
        {{- if eq $role "worker" }}
        - name: document-verification
          image: {{ $root.Values.documentService.image | quote }}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ $root.Values.secretName }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
        {{- end }}
        {{- if $root.Values.cloudSql.instance }}
        - name: cloud-sql-proxy
          image: {{ $root.Values.cloudSql.proxyImage | quote }}
          args: ["--private-ip", "--port=5432", {{ $root.Values.cloudSql.instance | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 65532
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: 3000

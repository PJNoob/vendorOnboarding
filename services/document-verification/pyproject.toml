[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-document-verification"
version = "1.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=1,<2", "google-cloud-documentai>=3,<4", "google-genai>=1,<2",
  "pypdf>=6,<7",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["vendor_verification*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
